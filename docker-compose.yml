services:
  rabbitmq-broker:
    image: rabbitmq:3-management
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"
      - "15672:15672"

  mongodb-store:
    image: mongo:7
    container_name: mongodb-store
    ports:
      - "27017:27017"
    # Ledger lives on a tmpfs, i.e. host RAM. Docker tears a tmpfs mount down
    # whenever the container stops, so `docker compose restart` wipes every
    # account. This is deliberate: restart_demo.py uses it to show the flaw of
    # keeping state in memory.
    tmpfs:
      - /data/db
    # THE FIX: swap the tmpfs above for a durable named volume, and the same
    # restart leaves balances untouched (also uncomment the volumes: block below).
    # volumes:
    #   - mongo_data:/data/db

  transaction-worker:
    build:
      context: .
      dockerfile: transaction_worker/Dockerfile
    container_name: transaction-worker
    environment:
      RABBITMQ_HOST: rabbitmq-broker
      MONGO_URI: mongodb://mongodb-store:27017
    depends_on:
      - rabbitmq-broker
      - mongodb-store

  balance-api:
    build:
      context: .
      dockerfile: balance_api/Dockerfile
    container_name: balance-api
    environment:
      MONGO_URI: mongodb://mongodb-store:27017
    ports:
      - "8000:8000"
    depends_on:
      - mongodb-store

# Durable storage for the "fix" half of the demo — see mongodb-store above.
# volumes:
#   mongo_data:
